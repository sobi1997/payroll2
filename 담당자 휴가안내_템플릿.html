<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>노무법인 두웰 - 담당자 휴가 안내 메일 매니저</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2b4d9e;
            --primary-hover: #203c7d;
            --bg-color: #edf1f9;
            --border-color: #e6ecf6;
            --text-color: #334155;
        }

        * { box-sizing: border-box; }

        html, body, input, button, select, textarea {
            font-family: 'Noto Sans KR', 'Pretendard', -apple-system, sans-serif;
            letter-spacing: -0.5px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body { margin: 0; padding: 20px; background: var(--bg-color); color: var(--text-color); display: flex; justify-content: center; }

        .container { display: flex; width: 100%; max-width: 1400px; gap: 24px; height: calc(100vh - 40px); }
        .panel { flex: 1; background: white; border-radius: 16px; border: 1px solid var(--border-color); display: flex; flex-direction: column; box-shadow: 0 10px 30px rgba(30,50,120,0.08); }
        .panel-header { padding: 18px 24px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 16px; background: #ffffff; color: var(--primary-color); border-radius: 16px 16px 0 0; display: flex; justify-content: space-between; align-items: center; }
        .hdr-home { font-size: 12.5px; font-weight: 600; color: var(--primary-color); text-decoration: none; padding: 5px 13px; border: 1px solid var(--border-color); border-radius: 100px; white-space: nowrap; transition: all .15s; }
        .hdr-home:hover { background: var(--primary-color); color: #fff; border-color: var(--primary-color); }
        .panel-body { padding: 24px; overflow-y: auto; flex: 1; }

        /* 컨트롤러 스타일 */
        .input-group { margin-bottom: 16px; position: relative; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; }
        .input-text { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px; color: #334155; background-color: white; font-family: 'Noto Sans KR', sans-serif; }
        .input-text:focus { outline: 2px solid var(--primary-color); border-color: transparent; }
        .input-text[type="date"] { cursor: pointer; }
        .input-warn-msg { color: #ef4444; font-size: 12px; margin-top: 4px; display: none !important; font-weight: 500; }
        .req { color: #ef4444; font-weight: 700; margin-left: 3px; }

        /* 좌우 2칸 배열 */
        .field-row { display: flex; gap: 12px; margin-bottom: 16px; }
        .field-row .input-group { flex: 1; margin-bottom: 0; }

        .section-box { border: 1px solid var(--border-color); border-radius: 12px; padding: 18px; margin-bottom: 22px; background: #fbfcfe; }
        .section-title { font-weight: 600; font-size: 15px; margin-bottom: 12px; color: var(--primary-color); }

        /* 프리뷰 스타일 */
        .preview-zone { display: flex; flex-direction: column; gap: 20px; }
        .card-box { background: white; border: 1px solid var(--border-color); border-radius: 14px; padding: 20px; position: relative; box-shadow: 0 6px 18px rgba(30,50,120,0.06); }
        .card-header-area { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px dashed var(--border-color); padding-bottom: 8px; }
        .card-tag { font-weight: bold; color: var(--primary-color); font-size: 13px; }

        .subject-text { font-weight: 600; color: #1e293b; font-size: 14px !important; padding: 4px 0; word-break: break-all; font-family: 'Noto Sans KR', sans-serif !important; letter-spacing: -0.5px !important; }
        .mail-wrapper { font-size: 14px !important; line-height: 1.6 !important; font-family: 'Noto Sans KR', sans-serif !important; }
        .mail-wrapper * { font-family: 'Noto Sans KR', sans-serif !important; font-size: 14px !important; letter-spacing: -0.5px !important; }

        .mini-copy-btn { background: #f1f5f9; color: #334155; border: 1px solid var(--border-color); padding: 5px 12px; border-radius: 4px; font-size: 12px; font-weight: 600; cursor: pointer; transition: 0.15s; min-width: 80px; text-align: center; }
        .mini-copy-btn:hover { background: var(--primary-color); color: white; border-color: var(--primary-color); }
        .mini-copy-btn.copied { background: #10b981 !important; color: white !important; border-color: #10b981 !important; }

        /* 필수 항목 미입력 시 뜨는 복사 차단 경고창 */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.55); align-items: center; justify-content: center; z-index: 1000; }
        .modal-overlay.show { display: flex; }
        .modal-card { background: #ffffff; border-radius: 14px; padding: 28px 28px 24px; width: 320px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.25); }
        .modal-icon { font-size: 32px; margin-bottom: 8px; line-height: 1; }
        .modal-title { font-weight: 700; font-size: 16px; color: #1e293b; margin-bottom: 6px; }
        .modal-desc { font-size: 13px; color: #64748b; margin-bottom: 14px; line-height: 1.5; }
        .modal-list { list-style: none; padding: 0; margin: 0 0 20px; text-align: left; display: block; }
        .modal-list li { font-size: 13.5px; color: #ef4444; font-weight: 700; padding: 3px 0; }
        .modal-list li::before { content: "• "; }
        .modal-close-btn { background: var(--primary-color); color: #ffffff; border: none; padding: 10px 26px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; }
        .modal-close-btn:hover { background: var(--primary-hover); }
    </style>
</head>
<body>
<div class="container">
    <div class="panel">
        <div class="panel-header"><span>담당자 휴가 안내 양식</span><a href="index.html" class="hdr-home">‹ 홈으로</a></div>
        <div class="panel-body">

            <div class="field-row">
                <div class="input-group">
                    <label>담당자 이름 <span class="req">*</span></label>
                    <input type="text" id="empName" class="input-text" placeholder="홍길동" oninput="renderMail()">
                    <div id="nameWarn" class="input-warn-msg">⚠️ 이름을 기입해주세요.</div>
                </div>
                <div class="input-group">
                    <label>직급 <span class="req">*</span></label>
                    <input type="text" id="empTitle" class="input-text" placeholder="노무사 / 대리 등" oninput="renderMail()">
                    <div id="titleWarn" class="input-warn-msg">⚠️ 직급을 기입해주세요.</div>
                </div>
            </div>

            <div class="input-group">
                <label>사유 <span class="req">*</span></label>
                <input type="text" id="reason" class="input-text" placeholder="연차 휴가 / 개인 사정 등" oninput="renderMail()">
                <div id="reasonWarn" class="input-warn-msg">⚠️ 사유를 기입해주세요.</div>
            </div>

            <div class="section-box">
                <div class="section-title">휴가 기간</div>
                <div class="field-row" style="margin-bottom: 0;">
                    <div class="input-group">
                        <label>시작일 <span class="req">*</span></label>
                        <input type="date" id="startDate" class="input-text" onchange="renderMail()">
                    </div>
                    <div class="input-group">
                        <label>종료일 <span class="req">*</span></label>
                        <input type="date" id="endDate" class="input-text" onchange="renderMail()">
                    </div>
                </div>
                <div id="startWarn" class="input-warn-msg">⚠️ 시작일을 선택해주세요.</div>
                <div id="endWarn" class="input-warn-msg">⚠️ 종료일을 선택해주세요.</div>
                <div style="font-size: 12px; color: #64748b; margin-top: 10px; line-height: 1.5;">
                    ※ 업무 복귀일은 종료일 다음날로 자동 계산되며, 주말(토·일)에 해당하면 다음 월요일로 표기됩니다.
                </div>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">메일 미리보기</div>
        <div class="panel-body" style="background: #f1f5f9; display: flex; flex-direction: column; gap: 16px;">

            <div class="preview-zone">
                <div class="card-box">
                    <div class="card-header-area">
                        <span class="card-tag">메일 제목</span>
                        <button class="mini-copy-btn" onclick="copyText('mailSubject', this, '제목 복사')">제목 복사</button>
                    </div>
                    <div id="mailSubject" class="subject-text"></div>
                </div>

                <div class="card-box">
                    <div class="card-header-area">
                        <span class="card-tag">메일 본문</span>
                        <button class="mini-copy-btn" onclick="copyText('mailPreview', this, '본문 복사')">본문 복사</button>
                    </div>
                    <div id="mailPreview" class="mail-wrapper"></div>
                </div>
            </div>

        </div>
    </div>
</div>

<div id="copyGuardOverlay" class="modal-overlay" onclick="if (event.target === this) closeCopyGuardModal()">
    <div class="modal-card">
        <div class="modal-icon">⚠️</div>
        <div class="modal-title">복사하기 전에 확인해주세요</div>
        <div class="modal-desc">아래 항목을 먼저 입력해야 제목/본문을 복사할 수 있습니다.</div>
        <ul id="copyGuardList" class="modal-list"></ul>
        <button class="modal-close-btn" onclick="closeCopyGuardModal()">확인</button>
    </div>
</div>

<script>
    const weekDays = ['일', '월', '화', '수', '목', '금', '토'];

    // 2026년 07월 13일 (월) 형식
    function formatDateWithDay(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '';
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const day = String(date.getDate()).padStart(2, '0');
        const dayName = weekDays[date.getDay()];
        return `${year}년 ${month}월 ${day}일 (${dayName})`;
    }

    // 제목용 짧은 날짜: 7/13
    function shortDate(dateString) {
        if (!dateString) return '';
        const date = new Date(dateString);
        if (isNaN(date.getTime())) return '';
        return (date.getMonth() + 1) + '/' + date.getDate();
    }

    // 업무 복귀일 = 종료일 다음날, 단 토/일이면 다음 월요일
    function calcReturnDate(endDateString) {
        if (!endDateString) return '';
        const date = new Date(endDateString);
        if (isNaN(date.getTime())) return '';
        date.setDate(date.getDate() + 1); // 다음날
        const day = date.getDay(); // 0:일 ~ 6:토
        if (day === 6) { date.setDate(date.getDate() + 2); }      // 토요일 → 월요일
        else if (day === 0) { date.setDate(date.getDate() + 1); } // 일요일 → 월요일
        const year = date.getFullYear();
        const month = String(date.getMonth() + 1).padStart(2, '0');
        const dd = String(date.getDate()).padStart(2, '0');
        const dayName = weekDays[date.getDay()];
        return `${year}년 ${month}월 ${dd}일 (${dayName})`;
    }

    function renderMail() {
        const name = document.getElementById('empName').value.trim();
        const title = document.getElementById('empTitle').value.trim();
        const reason = document.getElementById('reason').value.trim();
        const startRaw = document.getElementById('startDate').value;
        const endRaw = document.getElementById('endDate').value;

        document.getElementById('nameWarn').style.display = name ? 'none' : 'block';
        document.getElementById('titleWarn').style.display = title ? 'none' : 'block';
        document.getElementById('reasonWarn').style.display = reason ? 'none' : 'block';
        document.getElementById('startWarn').style.display = startRaw ? 'none' : 'block';
        document.getElementById('endWarn').style.display = endRaw ? 'none' : 'block';

        const startFmt = formatDateWithDay(startRaw);
        const endFmt = formatDateWithDay(endRaw);
        const returnFmt = calcReturnDate(endRaw);

        // 제목: 기간(7/13~7/15)만 가변
        const rangeShort = (startRaw && endRaw) ? ` (${shortDate(startRaw)}~${shortDate(endRaw)})` : '';
        document.getElementById('mailSubject').innerText = `담당자 휴가로 인한 업무 처리 안내${rangeShort}`;

        const emailTemplate = `
            <div style="max-width: 600px; font-family: 'Noto Sans KR', sans-serif; font-size: 14px; line-height: 1.6; color: #333333;">
                <p style="margin: 0 0 16px 0; font-family: 'Noto Sans KR', sans-serif; color: #333333;">안녕하십니까,</p>

                <p style="margin: 0 0 24px 0; font-family: 'Noto Sans KR', sans-serif; color: #333333;">노무법인 두웰 <span style="font-weight: bold; color: #2b4d9e;">${name}</span> <span style="font-weight: bold; color: #2b4d9e;">${title}</span>입니다.</p>

                <p style="margin: 0 0 24px 0; font-family: 'Noto Sans KR', sans-serif; color: #333333;"><span style="font-weight: bold; color: #2b4d9e;">${reason}</span> 일정으로 인해 아래 기간 동안 자리를 비우게 되어 사전에 안내드립니다.</p>

                <div style="background-color: #f8fafc; border-left: 4px solid #2b4d9e; padding: 14px 16px; margin-bottom: 24px; border-radius: 0 6px 6px 0; font-family: 'Noto Sans KR', sans-serif; color: #333333;">
                    <div style="margin-bottom: 6px; font-family: 'Noto Sans KR', sans-serif;">휴가 기간 : <span style="font-weight: bold; color: #2b4d9e;">${startFmt}</span> ~ <span style="font-weight: bold; color: #2b4d9e;">${endFmt}</span></div>
                    <div style="font-family: 'Noto Sans KR', sans-serif;">업무 복귀일 : <span style="font-weight: bold; color: #2b4d9e;">${returnFmt}</span></div>
                </div>

                <p style="margin: 0 0 24px 0; font-family: 'Noto Sans KR', sans-serif; color: #333333;">상기 기간 중에는 업무 처리가 다소 지연될 수 있는 점 양해 부탁드리며,<br>요청 사항 또는 기타 문의사항은 메일로 회신 주시면 복귀 후 순차적으로 확인하여 신속히 안내드리겠습니다.</p>

                <p style="margin: 0; font-family: 'Noto Sans KR', sans-serif; color: #333333;">감사합니다.</p>
            </div>
        `;
        document.getElementById('mailPreview').innerHTML = emailTemplate;
    }

    // 이름 / 직급 / 사유 / 시작일 / 종료일이 모두 입력되어야 복사 허용
    function getMissingRequiredFields() {
        const missing = [];
        if (!document.getElementById('empName').value.trim()) missing.push('담당자 이름');
        if (!document.getElementById('empTitle').value.trim()) missing.push('직급');
        if (!document.getElementById('reason').value.trim()) missing.push('사유');
        if (!document.getElementById('startDate').value) missing.push('휴가 시작일');
        if (!document.getElementById('endDate').value) missing.push('휴가 종료일');
        return missing;
    }

    function showCopyGuardModal(missingFields) {
        document.getElementById('copyGuardList').innerHTML = missingFields.map(f => `<li>${f}</li>`).join('');
        document.getElementById('copyGuardOverlay').classList.add('show');
    }

    function closeCopyGuardModal() {
        document.getElementById('copyGuardOverlay').classList.remove('show');
    }

    function copyText(elementId, btnElement, originalText) {
        const missing = getMissingRequiredFields();
        if (missing.length > 0) {
            renderMail();
            showCopyGuardModal(missing);
            return;
        }

        const container = document.getElementById(elementId);
        let targetNode = container;
        if (elementId === 'mailSubject') {
            const tempDiv = document.createElement('div');
            tempDiv.style.fontFamily = "'Noto Sans KR', sans-serif";
            tempDiv.style.fontSize = "14px";
            tempDiv.style.fontWeight = "600";
            tempDiv.innerText = container.innerText;
            document.body.appendChild(tempDiv);
            targetNode = tempDiv;
        }
        const range = document.createRange();
        range.selectNode(targetNode);
        window.getSelection().removeAllRanges();
        window.getSelection().addRange(range);

        try {
            document.execCommand('copy');
            btnElement.classList.add('copied');
            btnElement.innerText = '복사 완료!';
            setTimeout(() => {
                btnElement.classList.remove('copied');
                btnElement.innerText = originalText;
            }, 1000);
        } catch (err) {
            console.error('복사 실패', err);
        }

        window.getSelection().removeAllRanges();
        if (elementId === 'mailSubject') {
            targetNode.remove();
        }
    }

    renderMail();
</script>
</body>
</html>
